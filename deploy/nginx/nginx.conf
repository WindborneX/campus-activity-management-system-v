# 校园活动管理系统 V1.0 —— Nginx 统一入口配置
#
# 联调方式（人工决策：前后端通过 Nginx 联系，浏览器不直连后端）：
#   1. 后端 Spring Boot 监听 127.0.0.1:8080
#   2. 前端开发服务器 Vite 监听 127.0.0.1:5173（cd web && npm run dev）
#   3. 启动 Nginx 后，浏览器只访问 http://localhost:8090
#      - /api/*  转发到后端 8080
#      - 其他    转发到 Vite 5173（含 HMR 的 WebSocket 升级）
#
# 使用（Windows 示例）：
#   nginx -p <nginx安装目录> -c <本文件绝对路径>
#   nginx -s stop   停止
#
# 最终演示若不想开 Vite，可改用下方「静态产物」server 块（已注释）：
#   cd web && npm run build，然后取消注释并把 root 指向 web/dist 的绝对路径。

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # ===== 开发联调入口：8090 =====
    server {
        listen       8090;
        server_name  localhost;

        # 后端接口
        # 浏览器同源访问 Nginx(8090)，剥离 Origin 头，避免后端按 8090→8080 误判为跨域而拒绝
        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host              $host;
            proxy_set_header Origin            "";
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 前端 Vite 开发服务器（含热更新 WebSocket）
        location / {
            proxy_pass http://127.0.0.1:5173;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
        }
    }

    # ===== 静态产物入口（最终演示用，默认关闭）=====
    # server {
    #     listen       8090;
    #     server_name  localhost;
    #
    #     location /api/ {
    #         proxy_pass http://127.0.0.1:8080;
    #         proxy_set_header Host $host;
    #     }
    #
    #     location / {
    #         root  D:/Projects/Camus-activity-management-system/web/dist;
    #         index index.html;
    #         try_files $uri $uri/ /index.html;   # history 路由回退
    #     }
    # }
}
