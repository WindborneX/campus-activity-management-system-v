# 校园活动管理系统 V1.0 —— Docker 版 Nginx 统一入口
#
# 架构（浏览器只访问 http://localhost:8090）：
#   浏览器 → Docker Nginx(容器内 80，映射宿主机 8090)
#              ├─ /api/* → host.docker.internal:8080  (Spring Boot，运行在宿主机)
#              └─ 其他   → host.docker.internal:5173  (Vite dev，需 host 0.0.0.0)
#
# 启动（在项目根目录）：
#   1. 启动后端：8080
#   2. 启动前端：cd web; npm run dev
#   3. 启动容器：
#      docker run -d --name campus-nginx -p 8090:80 ^
#        --mount type=bind,source=%CD%/deploy/nginx/nginx.docker.conf,target=/etc/nginx/nginx.conf,readonly ^
#        nginx:latest
#   4. 浏览器访问 http://localhost:8090
#   停止：docker rm -f campus-nginx

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    server {
        listen       80;
        server_name  localhost;

        # 后端接口（容器 → 宿主机）
        # 浏览器同源访问 Nginx(8090)，剥离 Origin 头，避免后端按 8090→8080 误判为跨域而拒绝
        location /api/ {
            proxy_pass http://host.docker.internal:8080;
            proxy_set_header Host              $host;
            proxy_set_header Origin            "";
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 前端 Vite 开发服务器（含热更新 WebSocket）
        location / {
            proxy_pass http://host.docker.internal:5173;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
        }
    }
}
